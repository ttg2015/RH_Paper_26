# Bins for stage g (figure data). Only stage g's fingerprint includes this file,
# so changing bins here never makes other stages stale. Keep bins fine: coarsening
# later is free (sum neighbouring bins), going finer needs a rerun of stage g.
lead: 0                 # event hour

bins:                   # [start, stop, step]
  delta: [-40.0, 60.0, 0.25]     # kJ/kg, for δ_FT, δ_S, δ_total
  rh:    [0.0, 1.05, 0.005]      # RH_2m (q / q_sat; can slightly exceed 1)
  zlcl:  [0.0, 5000.0, 25.0]     # m above ground
  energy: [280.0, 390.0, 0.5]    # kJ/kg, for h*500, h_2m, h_LPL planes

hist1d: [delta_FT, delta_S, delta_total]
hist2d:                 # name: [x quantity, x bins, y quantity, y bins]
  h2_rh_dFT:   [RH_2m, rh, delta_FT, delta]
  h2_rh_dS:    [RH_2m, rh, delta_S, delta]
  h2_rh_dtotal: [RH_2m, rh, delta_total, delta]   # dry vs moist histograms
  h2_zlcl_dFT: [zLCL_2m, zlcl, delta_FT, delta]
  h2_hs500_h2m:  [h_star500, energy, h_2m, energy]       # surface layer correction figure
  h2_hs500_hlpl: [h_star500, energy, h_LPL, energy]
  h2_hs500_h500: [h_star500, energy, h500, energy]       # box figures (RH demo panel a)
maps: [delta_FT, delta_S, delta_total]
map_sp_min_hPa: 500     # maps keep every cell (ocean too) with surface pressure above this

# Convective split of δ_FT (old Paper_Plots-2 cells 124/137): plume from the LPL at this ε
convective:
  eps: 0.2

# Mask for figure data: latitude band + land only. The terrain cut (zs < 0.5 km) is applied
# only to the entrainment analysis (stage f). Profile composites drop below-ground levels.
mask:
  lsm_min: 0.9
  zs_max_km: null

# Cascade composites: RH-binned mean profiles in four free-tropospheric energy boxes
# (h*_500, h_500 in kJ/kg), as in Cascade_Summary.ipynb cell 5 (plot_cascade).
cascade:
  rh_bins: [0.0, 1.0, 0.01]        # coarsen to 5 % at plot time
  zs_max_km: 0.5                   # terrain cut for the composites only (as old cascade and stage e)
  profile_vars: [MSE, MSE_sat, T, Z]
  boxes:
    T_MLL: {h_star: [326.0, 329.0], h: [320.0, 323.0]}
    M_MLL: {h_star: [326.0, 329.0], h: [320.0, 323.0]}
    T_TPL: {h_star: [336.5, 339.5], h: [325.5, 328.5]}
    M_TPL: {h_star: [338.0, 342.0], h: [332.0, 335.0]}

# Box hit maps (old Paper_Plots-2 cells 165–169): per cell, was the year's event inside the box?
# CASCADE boxes come from `cascade.boxes`; APPENDIX boxes are the e_RH_bins / appendix set.
hit_boxes:
  T_TPL_app: {h_star: [336.5, 341.5], h: [325.0, 330.0]}
  T_MLL_app: {h_star: [325.0, 330.0], h: [319.5, 324.5]}
  M_TPL_app: {h_star: [337.5, 342.5], h: [332.5, 337.5]}
  M_MLL_app: {h_star: [325.0, 330.0], h: [319.5, 324.5]}

# Plume tops ("strike points") from stage f's Ztop files
strike:
  p_bins: [100.0, 1000.0, 5.0]     # hPa
  eps_detail: 0.2                  # ε for the RH × p_top plane and the map
  rh_bins: [0.0, 1.05, 0.01]       # RH resolution of plume tops and categories (dry vs moist split)
