# Bins for stage g (figure data). Only stage g's fingerprint includes this file,
# so changing bins here never makes other stages stale. Keep bins fine: coarsening
# later is free (sum neighbouring bins), going finer needs a rerun of stage g.
lead: 0                 # event hour

bins:                   # [start, stop, step]
  delta: [-40.0, 60.0, 0.25]     # kJ/kg, for δ_FT, δ_S, δ_total
  rh:    [0.0, 1.05, 0.005]      # RH_2m (q / q_sat; can slightly exceed 1)
  zlcl:  [0.0, 5000.0, 25.0]     # m above ground

hist1d: [delta_FT, delta_S, delta_total]
hist2d:                 # name: [x quantity, x bins, y quantity, y bins]
  h2_rh_dFT:   [RH_2m, rh, delta_FT, delta]
  h2_rh_dS:    [RH_2m, rh, delta_S, delta]
  h2_zlcl_dFT: [zLCL_2m, zlcl, delta_FT, delta]
maps: [delta_FT, delta_S, delta_total]
